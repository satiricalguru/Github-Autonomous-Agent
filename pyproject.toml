[project]
name = "github-autonomous-agent"
version = "0.1.0"
description = "Autonomous GitHub Agent for Google Antigravity - Inbox management, top-tier issue hunter & PR solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
github-agent = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["_frontend/index.html", "_frontend/css/*.css", "_frontend/dist/*.js", "_frontend/dist/components/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
search-path = [".", "src"]

[tool.pyright]
extraPaths = [".", "src"]

