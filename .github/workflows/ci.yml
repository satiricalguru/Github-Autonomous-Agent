name: Readiness checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m pytest -q --ignore=tests/test_browser.py
  browser-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -c requirements.lock -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- frontend/dist src/_frontend
      - run: python -m pytest tests/test_browser.py -q
      - run: python -m pip wheel . --no-deps -w dist
      - run: python scripts/check_wheel.py dist/*.whl
